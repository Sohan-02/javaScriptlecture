<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    
    //increment 
        //in suffix prints value first then adds
    let a = 8;
    a++;
    console.log(a);

        //increment in prefix adds value first then print
    let c = 8;
    console.log(++c);
    
    //decrement
    let b=5;
    b--,
    console.log(b);

    //ternary operator

    let age =45;
    console.log(age>18? "eligible" : "not eligible");
    
    
    </script>
</body>
</html>

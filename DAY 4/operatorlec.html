<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- operator is a symbol used to perform operations on values or variables
        an operator is a symbol that performs an operation on one or more operends(values or variables).
    -->
    <script>
        let a =2;
        let b =4;
        let c =a+b;

        console.log(c); //add
        console.log(b-a);//subtract
        console.log(b*a);//multiply
        console.log(b/a);//division
        console.log(b%a);//modules(Remainder)
        console.log(a**b);//exponent(Power)

        //assignment operator

        d=2;
        d+=5;
        console.log(d);

        //comparision operator
        let z=4;
        let y=5;

        //equal to
        console.log(z==y);

        //strict equal
        console.log(3==="3");

        //Not equal
        console.log(3!=="3");

        //strict not equal
        console.log(z!=y);

        //greater then
        console.log(z>y);

        //less then
        console.log(z<y);

        //greater then equal to
        console.log(z>=y);

        //less then equal to
        console.log(z<=y);
        


        //logical operator 

        let m=22;
        let n=6;

        console.log(m>n && m>22);
        console.log(m>n || m>22);
        console.log(!(m>n));
        
        //&& AND returns true only if all condition are true
        //|| OR returns true if atleast one condition true
        //! NOT Reverse the boolean value (true becomes false, and false becomes true)
        
        </script>
    </body>
</html>

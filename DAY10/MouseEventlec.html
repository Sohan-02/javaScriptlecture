<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- An event in javascript is an action or occerance that happens in a web browser , such as clicking a button ,typing in a textbox , moving the mouse , or submitting a form -->

    <button onclick="alertmessage()">on click</button>
    <br><br>
    <button ondblclick="alertmessage()">double click</button>
    <br><br>
    <button onmouseleave="alertmessage()">mouse leave</button>
    <br><br>
    <button onmouseup="alertmessage()">mouse up</button>
    <br><br>

    <button onmouseover="alertmessage()">mouse over</button>
    <br><br>

    <script>
        function alertmessage(){
        alert("this is message");
        //console.log("hello");
        
        //document.write("hello");
        }
    </script>
</body>
</html>

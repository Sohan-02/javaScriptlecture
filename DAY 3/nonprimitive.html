<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- nonprimitive data types Stores multiple value or complex data
        
    -->
    <script>
        //object
        // object - stores data as key-value pair 
       let college={
         name:"Rohan",
         age:54,
         city:"mumbai",
       } 

       console.log(college);
       console.log(college.name);
       console.log(college.city);
       

       //array
       //store multiple values in a single variable.
       //square brackets[] are used
       //array is mutable and string is immutable
       let name=["rohan","ajay","shivam"];
       console.log(name);
       console.log(name[1]);

       
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- premitive are the basic data type stores single value 
    number string boolean undefined null symbol biint 
    -->
    <script>
        let age = 23;
        console.log(age , typeof age);
        
        let n = 345.3;
        console.log(n , typeof n);

        
        //bigint
        let y =5665312572738n;
        console.log(y, typeof y);


        let name = "rohan";
        console.log(name , typeof name);

        let firstname = "345";
        console.log(firstname , typeof firstname);



        //boolean
        na= true;
        console.log(na , typeof na);

        nam = false;
        console.log(nam , typeof nam);


        //undefine
        let value;
        console.log(value , typeof value);

        //null
        let address1 = null;
        console.log(address1 , typeof address1);

        //symbol
        cityname=Symbol("id");
        console.log(cityname , typeof cityname);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <!-- While loop 
    A while loop executes the code as long as the condition is true 
    -->
   <script>
    let i =1;
    while(i<=5)
   {
    
    document.write("hello world <br>");
    i++;
    
   }

   let j = 90;
   while(j >=80)
   {
    document.write(j," <br>");
    j--;
   }


   </script> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Do while loop executes the code atlest once ,even if the condition is false.
      in a do -while loop , the code executes first and then the condition is checked-->
    <script>
        
        let z =1;
        do{
            document.write(z+"<br>");
            z++;
        }while (z <=5);
    </script>
</body>
</html>

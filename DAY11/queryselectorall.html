<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- QuerySelectorAll() is a javascript DOM method used to select all HTML element that matches a specified css selector. -->

    
    <p class="demo">Hello</p>
    <p class="demo">welcome</p>
    <p class="demo">JavaScript</p>
    <button onmouseover="changecolor()" onmouseleave="defaultcolor()" >subbmit</button>
    
    <script>
        function changecolor()
        {
            let data = document.querySelectorAll(".demo")
            data[0].style.color="red";
            data[1].style.color="blue";
            data[2].style.color="green";
        }

        function defaultcolor()
         
        {
            let data = document.querySelectorAll(".demo")
            data[0].style.color="black";
            data[1].style.color="black";
            data[2].style.color="black";
        }
    </script>
</body>
</html>

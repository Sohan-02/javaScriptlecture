<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let day = 3;
        //switch: is used to compare one expression with multiple expression
        switch(day){
            case 1:
                document.write("Monday");
                break;
            case 2:
                document.write("Tuesday");
                break;
            case 3:
                document.write( "Wednesday");
                break;
            case 4:
                document.write("Thursday");
                break;
            case 5:
                document.write("Friday");
                break;
            case 6:
                document.write("Saturday");
                break;
            case 7:
                document.write("Sunday");
                break;
        

        default:
            document.write("invalid Day");
        }


        let name = "sohan";
        
        switch(name){
            case "sohan":
                document.write("<br> Hey sohan , hello there!");
                break;
            case aniket:
                document.write("Hello aniket , welcome");
                break;
            case alok:
                document.write( "Hi Alok , welcome");
                break;
            case darshan:
                document.write("Hi darshan , welcome");
                break;
                
        

        default:
            document.write("invalid Day");
        }
    </script>
</body>
</html>
